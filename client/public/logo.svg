<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anther Academy">
  <!-- Academic mark: pediment + columns motif (temple of learning), navy + gold -->
  <circle cx="100" cy="100" r="94" fill="#0f1829"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#cfa958" stroke-width="2.5"/>

  <!-- Pediment (roof/triangle) -->
  <polygon points="100,52 138,96 62,96" fill="#cfa958"/>

  <!-- Entablature bar under pediment -->
  <rect x="58" y="96" width="84" height="7" fill="#cfa958"/>

  <!-- Columns -->
  <rect x="70" y="107" width="11" height="41" fill="#f8fafc"/>
  <rect x="94.5" y="107" width="11" height="41" fill="#f8fafc"/>
  <rect x="119" y="107" width="11" height="41" fill="#f8fafc"/>

  <!-- Stylobate (base) -->
  <rect x="56" y="148" width="88" height="7" fill="#cfa958"/>
  <rect x="50" y="155" width="100" height="6" fill="#cfa958" opacity="0.55"/>
</svg>
